name: Generate DJ Chart RSS Feed

on:
  workflow_dispatch:
  schedule:
    # Run once a day at midnight UTC to stay within the Serper.dev 2500/mo free tier
    - cron: '0 0 * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install feedgen requests

      - name: Run Feed Generator
        env:
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
        run: python main.py

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./output # Assumes main.py writes feed.xml to an output/ folder
          publish_branch: gh-pages
          force_orphan: true
